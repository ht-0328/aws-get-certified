<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用語集 | AWS 合格ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .search { width: 100%; font: inherit; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
  .search:focus { outline: none; border-color: var(--accent); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 18px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); color: var(--bg); border-color: var(--navy); }
  .term-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 8px 0; }
  .term-item .w { font-weight: 800; font-size: 1.05rem; }
  .term-item .r { color: var(--ink-3); font-size: .82rem; margin-left: 8px; }
  .term-item .m { color: var(--ink-2); margin-top: 2px; line-height: 1.7; }
  .term-item .c { font-size: .75rem; color: var(--accent-ink); text-decoration: none; }
</style>
</head>
<body data-root="./" data-page="glossary">
<main class="wrap">
<h1>📖 用語集</h1>
<p class="lead">全章に登場する専門用語の定義と、問題文によく出る言葉（カタカナ語）の意味をまとめています。日本語・英語のどちらでも検索できます。</p>
<input class="search" id="q" type="search" placeholder="例：リージョン、S3、レイテンシー" aria-label="用語を検索">
<div class="filters" id="filters"></div>
<p class="muted" id="count"></p>
<div id="list"></div>
</main>
<script src="assets/data/ch01.js"></script>
<script src="assets/data/ch02.js"></script>
<script src="assets/data/ch03.js"></script>
<script src="assets/data/ch04.js"></script>
<script src="assets/data/ch05.js"></script>
<script src="assets/data/ch06.js"></script>
<script src="assets/data/ch07.js"></script>
<script src="assets/data/ch08.js"></script>
<script src="assets/data/ch09.js"></script>
<script src="assets/data/words.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var data = (window.AWSNOTE && AWSNOTE.terms) || [];
  var chapters = (window.AWSNOTE_CHAPTERS || []).filter(function (c) { return c.id !== "method"; });
  var chTitle = {}; var chFile = {};
  chapters.forEach(function (c) { chTitle[c.id] = c.short; chFile[c.id] = c.file; });
  var current = "all";
  var filters = document.getElementById("filters");
  filters.innerHTML = '<button class="chip" data-ch="all" aria-pressed="true">すべて</button>' +
    chapters.map(function (c) { return '<button class="chip" data-ch="' + c.id + '" aria-pressed="false">' + c.short + "</button>"; }).join("") +
    '<button class="chip" data-ch="words" aria-pressed="false">問題文の言葉</button>';
  filters.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    current = b.getAttribute("data-ch");
    filters.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    render();
  });
  function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var sorted = data.slice().sort(function (a, b) { return a.w.localeCompare(b.w, "ja"); });
  var input = document.getElementById("q");
  function render() {
    var q = input.value.trim().toLowerCase();
    var hits = sorted.filter(function (t) {
      if (current !== "all" && t.ch !== current) return false;
      if (!q) return true;
      return (t.w + " " + (t.r || "") + " " + t.m).toLowerCase().indexOf(q) >= 0;
    });
    document.getElementById("count").textContent = hits.length + " 件";
    document.getElementById("list").innerHTML = hits.map(function (t) {
      return '<div class="term-item"><span class="w">' + esc(t.w) + '</span><span class="r">' + esc(t.r) + "</span>" +
        '<div class="m">' + esc(t.m) + "</div>" +
        (chFile[t.ch] ? '<a class="c" href="chapters/' + chFile[t.ch] + '">→ ' + esc(chTitle[t.ch]) + " の章を開く</a>" : "") + "</div>";
    }).join("") || '<p class="muted">該当する用語はありません。</p>';
  }
  input.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
