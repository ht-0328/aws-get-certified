<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>復習カード | AWS 合格ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); color: var(--bg); border-color: var(--navy); }
  .flash { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 24px; min-height: 260px; display: flex; flex-direction: column; gap: 14px; }
  .flash .meta { font-size: .8rem; color: var(--ink-3); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .flash .qtext { font-size: 1.25rem; font-weight: 800; line-height: 1.7; }
  .flash .atext { border-top: 2px dashed var(--line); padding-top: 14px; color: var(--ink); line-height: 1.8; }
  .flash .hint { color: var(--ink-3); font-size: .9rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .btn.good { background: var(--green); color: #fff; }
  .btn.bad { background: var(--red); color: #fff; }
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 14px 0; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .boxes { display: flex; gap: 6px; flex-wrap: wrap; font-size: .8rem; }
  .boxes span { background: var(--surface-2); border-radius: 8px; padding: 4px 10px; color: var(--ink-2); }
</style>
</head>
<body data-root="./" data-page="cards">
<main class="wrap">
<h1>🃏 復習カード</h1>
<p class="lead">問題を見たら、<b>答えを見る前に</b>頭の中（できれば声に出して）で答えてください。思い出す作業そのものが記憶を強くします（アクティブリコール）。</p>
<div class="box science">
  <div class="box-title"><span class="em">🔬</span>しくみ</div>
  「思い出せた」カードは次に出るまでの間隔がのびます（今日 → 1日 → 3日 → 7日 → 14日 → 30日）。「思い出せなかった」カードは最初に戻って、すぐまた出てきます。記録はこのブラウザに保存されます。
</div>

<div class="filters" id="filters"></div>
<div class="filters">
  <button class="chip" data-mode="due" aria-pressed="true">今日やるカード</button>
  <button class="chip" data-mode="all" aria-pressed="false">全部（期限に関係なく）</button>
</div>
<div class="boxes" id="boxes"></div>
<div class="progress"><div id="bar"></div></div>
<div class="flash" id="flash" aria-live="polite"></div>
<p style="margin-top:16px"><button class="btn ghost small" id="reset">カードの記録をすべてリセット</button></p>
</main>
<script src="assets/data/ch01.js"></script>
<script src="assets/data/ch02.js"></script>
<script src="assets/data/ch03.js"></script>
<script src="assets/data/ch04.js"></script>
<script src="assets/data/ch05.js"></script>
<script src="assets/data/ch06.js"></script>
<script src="assets/data/ch07.js"></script>
<script src="assets/data/ch08.js"></script>
<script src="assets/data/ch09.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var store = window.AWSNOTE_STORE;
  var cards = (window.AWSNOTE && AWSNOTE.cards) || [];
  var chapters = (window.AWSNOTE_CHAPTERS || []).filter(function (c) { return c.id !== "method"; });
  var chTitle = {}; chapters.forEach(function (c) { chTitle[c.id] = c.short; });
  var INTERVALS = [0, 1, 3, 7, 14, 30]; // 箱の番号ごとの間隔（日）
  var DAY = 86400000;
  function key(c) { var s = c.ch + c.q, h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return c.ch + ":" + h; }
  var state = store.load("cards", {});
  function info(c) { return state[key(c)] || { box: 0, due: 0 }; }
  function isDue(c) { var d = info(c).due; var t = new Date(); t.setHours(23, 59, 59, 999); return d <= t.getTime(); }

  var ch = "all", mode = "due", queue = [], pos = 0, shown = false;
  function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var filters = document.getElementById("filters");
  filters.innerHTML = '<button class="chip" data-ch="all" aria-pressed="true">すべての章</button>' +
    chapters.map(function (c) { return '<button class="chip" data-ch="' + c.id + '" aria-pressed="false">' + c.short + "</button>"; }).join("");
  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () {
      var group = b.hasAttribute("data-ch") ? "data-ch" : "data-mode";
      document.querySelectorAll("[" + group + "]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if (group === "data-ch") ch = b.getAttribute("data-ch"); else mode = b.getAttribute("data-mode");
      build();
    });
  });

  function build() {
    queue = shuffle(cards.filter(function (c) { return (ch === "all" || c.ch === ch) && (mode === "all" || isDue(c)); }));
    pos = 0; shown = false; draw();
  }
  function drawBoxes() {
    var pool = cards.filter(function (c) { return ch === "all" || c.ch === ch; });
    var counts = [0, 0, 0, 0, 0, 0, 0];
    pool.forEach(function (c) { counts[Math.min(info(c).box, 6)]++; });
    var names = ["未学習・やり直し", "1日", "3日", "7日", "14日", "30日", "定着"];
    document.getElementById("boxes").innerHTML = counts.map(function (n, i) { return "<span>" + names[i] + "：" + n + "枚</span>"; }).join("");
  }
  function draw() {
    drawBoxes();
    var el = document.getElementById("flash");
    document.getElementById("bar").style.width = queue.length ? (pos / queue.length * 100) + "%" : "100%";
    if (pos >= queue.length) {
      el.innerHTML = '<div class="qtext">🎉 今日のカードはおしまいです</div><p class="hint">' +
        (queue.length ? queue.length + " 枚おつかれさまでした。" : "今やるべきカードはありません。") +
        "「全部」を選ぶと期限に関係なく練習できます。新しい章を読み進めるのもおすすめです。</p>";
      return;
    }
    var c = queue[pos];
    el.innerHTML =
      '<div class="meta"><span>' + esc(chTitle[c.ch] || c.ch) + "</span><span>" + (pos + 1) + " / " + queue.length + "</span></div>" +
      '<div class="qtext">' + esc(c.q) + "</div>" +
      (shown
        ? '<div class="atext">' + esc(c.a) + "</div>" +
          '<div class="actions"><button class="btn good" data-r="2">✓ 思い出せた</button><button class="btn ghost" data-r="1">△ あやしい</button><button class="btn bad" data-r="0">✗ 思い出せなかった</button></div>'
        : '<p class="hint">まず頭の中で答えてください。</p><div class="actions"><button class="btn" data-r="show">答えを見る</button></div>');
    el.querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { answer(b.getAttribute("data-r")); }); });
  }
  function answer(r) {
    if (r === "show") { shown = true; draw(); return; }
    var c = queue[pos], k = key(c), cur = info(c);
    var box = r === "2" ? Math.min(cur.box + 1, 6) : r === "1" ? Math.max(cur.box, 1) : 0;
    var days = box >= 6 ? 60 : INTERVALS[box];
    state[k] = { box: box, due: Date.now() + days * DAY };
    if (r === "0") queue.push(c); // 思い出せなかったカードは、この回の最後にもう一度
    store.save("cards", state);
    pos++; shown = false; draw();
  }
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("カードの記録をすべて消しますか？")) return;
    state = {}; store.save("cards", state); build();
  });
  build();
})();
</script>
</body>
</html>
